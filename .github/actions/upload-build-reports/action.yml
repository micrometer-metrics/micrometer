name: Upload Build Reports
description: Upload reports generated by the build
runs:
  using: composite
  steps:
    - name: Upload Build Reports
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
      with:
        name: ${{ github.job }}-reports
        path: '**/build/reports'
