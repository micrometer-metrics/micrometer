import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar
import com.github.jengelman.gradle.plugins.shadow.transformers.ResourceTransformer
import com.github.jengelman.gradle.plugins.shadow.transformers.TransformerContext
import org.apache.tools.zip.ZipEntry
import org.apache.tools.zip.ZipOutputStream
import org.gradle.api.GradleException
import org.gradle.api.file.FileTreeElement

plugins {
    alias(libs.plugins.shadow)
}

dependencies {
    api project(':micrometer-core')

    implementation platform(libs.reactorBom)
    implementation platform(libs.nettyBom)

    implementation 'io.projectreactor:reactor-core'
    implementation('io.projectreactor.netty:reactor-netty-core') {
        // We do not use HTTP modules; exclude to avoid false positive CVE reports
        exclude module: 'netty-codec-http'
    }
    // We need to make sure netty dns resolution works on all macs
    implementation(group: 'io.netty', name: 'netty-resolver-dns-native-macos', classifier: 'osx-x86_64')
    implementation(group: 'io.netty', name: 'netty-resolver-dns-native-macos', classifier: 'osx-aarch_64')
    implementation(group: 'io.netty', name: 'netty-transport-native-epoll', classifier: 'linux-aarch_64')
    implementation(group: 'io.netty', name: 'netty-transport-native-epoll', classifier: 'linux-x86_64')

    testImplementation project(':micrometer-test')
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation "ch.qos.logback:logback-classic:$logback12Version"
    testImplementation libs.restAssured
    testImplementation libs.awaitility
    testImplementation libs.testcontainers.junitJupiter
    // for running tests with UDS on OSX
    testImplementation(group: 'io.netty', name: 'netty-transport-native-kqueue', classifier: 'osx-x86_64')
    testImplementation(group: 'io.netty', name: 'netty-transport-native-kqueue', classifier: 'osx-aarch_64')
}

nebulaPublishVerification {
    // Verification fails due to the `+` version, but since this is a test dependency we don't publish, ignore it.
    ignore('io.netty:netty-transport-native-kqueue')
}

tasks.named('jar') {
    enabled = false
}

def shadowJar = tasks.named('shadowJar', ShadowJar) {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    failOnDuplicateEntries = true
    configurations.set([project.configurations.compileClasspath])
    archiveClassifier.set('')
    dependencies {
        include(dependency('io.projectreactor:.*'))
        include(dependency('io.projectreactor.netty:.*'))
        include(dependency('org.reactivestreams:reactive-streams:.*'))
        include(dependency('io.netty:.*'))
    }
    // see gh-5953
    exclude("META-INF/maven/**")
    exclude("META-INF/io.netty.versions.properties")
    relocate 'reactor', 'io.micrometer.shaded.reactor'
    relocate 'org.reactivestreams', 'io.micrometer.shaded.org.reactorstreams'
    relocate 'io.netty', 'io.micrometer.shaded.io.netty'
    relocate 'META-INF/native/libnetty', 'META-INF/native/libio_micrometer_shaded_netty'
    // see gh-3212
    transform(NativeImageConfigRelocatingTransformer)
    metaInf {
        from "$rootDir/LICENSE"
        from "$rootDir/NOTICE"
    }
    mergeServiceFiles()
}

tasks.japicmp.dependsOn(shadowJar)

// The Nebula Publishing plugin automatically configures the publication of the shadow jar but
// shadow dependencies are added to the POM as runtime so we manually clean up the POM.
publishing {
    publications {
        withType(MavenPublication) {
            pom.withXml {
                asNode()
                    .dependencies
                    .dependency
                    .findAll { ['reactor-core', 'reactor-netty-core', 'netty-resolver-dns-native-macos', 'netty-transport-native-epoll'].contains(it.artifactId.text()) }
                    .each { it.parent().remove(it) }
            }
        }
    }
}

dockerTest {
    systemProperty 'telegraf-image.version', '1.37.1'
    systemProperty 'influxdb-image.version', '2.8.0'
}

// Shadow relocates class bytecode but not string literals in resource files, so GraalVM
// native-image config shipped in shaded jars still names the pre-shading classes.
class NativeImageConfigRelocatingTransformer implements ResourceTransformer {

    private final Map<String, String> transformedResources = new LinkedHashMap<>()

    @Override
    boolean canTransformResource(FileTreeElement element) {
        def path = element.relativePath.pathString
        return path.startsWith('META-INF/native-image/') &&
                (path.endsWith('.json') || path.endsWith('.properties'))
    }

    @Override
    void transform(TransformerContext context) {
        String content = context.inputStream.getText('UTF-8')
        for (relocator in context.relocators) {
            content = relocator.applyToSourceContent(content)
        }
        if (transformedResources.putIfAbsent(context.path, content) != null) {
            throw new GradleException("Duplicate native-image config resource at ${context.path}")
        }
    }

    @Override
    boolean hasTransformedResource() {
        return !transformedResources.isEmpty()
    }

    @Override
    void modifyOutputStream(ZipOutputStream os, boolean preserveFileTimestamps) {
        transformedResources.each { path, content ->
            os.putNextEntry(new ZipEntry(path))
            os.write(content.getBytes('UTF-8'))
            os.closeEntry()
        }
    }
}
